<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <circle cx="400" cy="200" r="240" fill="url(#glow3)"/>

  <!-- Pipeline Diagram Visual -->
  <g transform="translate(100, 100)">
    <!-- Stage 1 -->
    <rect x="0" y="30" width="160" height="110" rx="12" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
    <circle cx="28" cy="55" r="10" fill="#3b82f6"/>
    <text x="28" y="59" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1</text>
    <text x="46" y="59" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Web Sources</text>
    <text x="16" y="90" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">20,000+ Raw Listings</text>
    <text x="16" y="110" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Dynamic JS Content</text>

    <!-- Arrow 1 -->
    <path d="M 170 85 L 200 85" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 2"/>

    <!-- Stage 2 -->
    <rect x="210" y="20" width="180" height="130" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="238" cy="48" r="10" fill="#06b6d4"/>
    <text x="238" y="52" fill="#020617" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">2</text>
    <text x="256" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Puppeteer + Queue</text>
    <text x="226" y="80" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Redis Distributed Jobs</text>
    <text x="226" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">CAPTCHA Bypass &amp; Retries</text>
    <text x="226" y="120" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700">⚡ 85% Processing Speedup</text>

    <!-- Arrow 2 -->
    <path d="M 400 85 L 430 85" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 2"/>

    <!-- Stage 3 -->
    <rect x="440" y="30" width="160" height="110" rx="12" fill="#1f2937" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="468" cy="55" r="10" fill="#10b981"/>
    <text x="468" y="59" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>
    <text x="486" y="59" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Verified DB</text>
    <text x="456" y="90" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Normalized Data</text>
    <text x="456" y="110" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10">60m → 9m Runtime</text>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(150, 280)">
    <rect x="0" y="0" width="500" height="60" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="80" y="35" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">20,000+ Records</text>
    <line x1="165" y1="15" x2="165" y2="45" stroke="#334155" stroke-width="1"/>
    <text x="250" y="35" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">85% Time Reduction</text>
    <line x1="335" y1="15" x2="335" y2="45" stroke="#334155" stroke-width="1"/>
    <text x="415" y="35" fill="#c084fc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Zero Data Loss</text>
  </g>

  <text x="400" y="415" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Business Data &amp; Workflow Automation Engine</text>
  <text x="400" y="440" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">High-Throughput Web Ingestion &amp; Fault-Tolerant Scheduling</text>
</svg>
