<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>
  <circle cx="400" cy="200" r="240" fill="url(#glow4)"/>

  <!-- Chat / WebSocket Visual -->
  <g transform="translate(180, 80)">
    <!-- Terminal / Client UI -->
    <rect x="0" y="0" width="440" height="230" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="38" rx="16" fill="#1e293b"/>
    <circle cx="25" cy="19" r="5" fill="#ef4444"/>
    <circle cx="42" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="19" r="5" fill="#10b981"/>
    <text x="220" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ws://api.realtime.internal/v1/stream</text>

    <!-- Message Bubbles -->
    <rect x="25" y="55" width="220" height="34" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="40" y="77" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Order #9482 dispatched to fleet</text>
    
    <rect x="195" y="100" width="220" height="34" rx="10" fill="#6d28d9" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="1"/>
    <text x="210" y="122" fill="#ddd6fe" font-family="system-ui, sans-serif" font-size="12">Acknowledged by Driver ID #421</text>
    <text x="390" y="122" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="10">✓✓</text>

    <!-- Socket Status Bar -->
    <rect x="25" y="155" width="390" height="50" rx="10" fill="#020617" stroke="#334155" stroke-width="1"/>
    <circle cx="45" cy="180" r="6" fill="#10b981"/>
    <text x="60" y="184" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CONNECTED • 200+ CONCURRENT CONNECTIONS</text>
    <text x="345" y="184" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">&lt;150ms</text>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(180, 335)">
    <rect x="0" y="0" width="440" height="50" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="75" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Sub-150ms Latency</text>
    <line x1="150" y1="12" x2="150" y2="38" stroke="#334155" stroke-width="1"/>
    <text x="220" y="30" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Socket.IO + Redis</text>
    <line x1="290" y1="12" x2="290" y2="38" stroke="#334155" stroke-width="1"/>
    <text x="365" y="30" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Persistent State</text>
  </g>

  <text x="400" y="435" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Real-Time Messaging &amp; Collaboration Engine</text>
  <text x="400" y="460" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">High-Concurrency WebSockets with Event Persistence</text>
</svg>
